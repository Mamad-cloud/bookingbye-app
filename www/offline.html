<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>BookingBye</title>
<!--
  The app's offline page: shown in the webview, in place of a page that could
  not be loaded because the phone has no connection or bookingbye.com cannot
  be reached (OfflinePage.java, OfflinePage.swift). Loaded with no network,
  as the page's text, at the address https://bookingbye.com/, so it can read
  the site's language cookie and theme and go back to the site, but nothing
  else: no external files, no fonts. Copied from the website's
  public/offline.html (its service worker's offline page) with these changes:
  "Try again" loads the page that failed, whose address the app writes in
  place of the FAILED_URL placeholder below; and when the phone is online but the
  site does not answer, it says so instead of "You're offline".
-->
<style>
  :root { --bg: #ffffff; --ink: #171717; --muted: #525252; --line: #e5e5e5; --brand: #083882; --inv: #ffffff; --card: #f8fafc; }
  html.dark { --bg: #171717; --ink: #f5f5f5; --muted: #a3a3a3; --line: #262626; --brand: #ffffff; --inv: #000000; --card: #1f1f1f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  html[dir="rtl"] body { font-family: "Noto Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif; }
  main { width: 100%; max-width: 420px; text-align: center; }
  .logo { width: 168px; height: auto; color: var(--brand); }
  .inv { color: var(--inv); }
  .mark { margin: 36px auto 20px; width: 64px; height: 64px; border-radius: 9999px; background: var(--card); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--muted); }
  h1 { margin: 0 0 10px; font-size: 22px; line-height: 1.3; }
  p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
  button {
    margin-top: 28px; width: 100%; height: 52px; border: 0; border-radius: 9999px; cursor: pointer;
    background: #083882; color: #ffffff; font: inherit; font-size: 16px; font-weight: 600;
  }
  button:active { background: #052555; }
  button:focus-visible { outline: 3px solid rgba(8, 56, 130, 0.35); outline-offset: 3px; }
  .note { margin-top: 14px; font-size: 13px; }
</style>
<script>
  // Before first paint, so the page never flashes the wrong language or theme.
  (function () {
    var root = document.documentElement;
    try { if (localStorage.getItem("theme") === "dark") root.classList.add("dark"); } catch (e) {}
    var match = document.cookie.match(/(?:^|;\s*)bb_locale=([^;]+)/);
    var locale = match ? decodeURIComponent(match[1]) : "";
    if (!/^(en|ar|ckb)$/.test(locale)) {
      var nav = (navigator.language || "en").toLowerCase();
      locale = /^(ckb|ku)/.test(nav) ? "ckb" : /^ar/.test(nav) ? "ar" : "en";
    }
    root.lang = locale;
    root.dir = locale === "en" ? "ltr" : "rtl";
    if (root.classList.contains("dark")) {
      document.querySelector('meta[name="theme-color"]').setAttribute("content", "#171717");
    }
  })();
</script>
</head>

  <h1 data-t="title">You're offline</h1>
  <p data-t="body">BookingBye needs a connection to search and book. Check your Wi-Fi or mobile data, then try again.</p>
  <button type="button" data-t="retry" onclick="retry()">Try again</button>
  <p class="note" data-t="note">This page reloads by itself when you're back online.</p>
</main>
<script>
  // The page that failed; the app writes its address here.
  var FAILED_URL = "__BOOKINGBYE_FAILED_URL__";

  function retry() {
    location.replace(/^https:\/\//.test(FAILED_URL) ? FAILED_URL : "/");
  }

  (function () {
    var COPY = {
      en: {
        unreachable: "Can't reach BookingBye",
        unreachableBody: "Your phone is online, but BookingBye isn't answering. Try again in a moment."
      },
      ar: {
        title: "أنت غير متصل بالإنترنت",
        body: "يحتاج BookingBye إلى اتصال بالإنترنت للبحث والحجز. تحقّق من شبكة Wi-Fi أو بيانات الهاتف، ثم حاول مرة أخرى.",
        retry: "حاول مرة أخرى",
        note: "ستُعاد تحميل الصفحة تلقائيًا عند عودة الاتصال.",
        unreachable: "تعذّر الوصول إلى BookingBye",
        unreachableBody: "هاتفك متصل بالإنترنت، لكن BookingBye لا يستجيب. حاول مرة أخرى بعد قليل."
      },
      ckb: {
        title: "پەیوەندیت بە ئینتەرنێتەوە نییە",
        body: "BookingBye بۆ گەڕان و حجزکردن پێویستی بە ئینتەرنێتە. Wi-Fi یان داتای مۆبایلەکەت بپشکنە، پاشان دووبارە هەوڵ بدەرەوە.",
        retry: "دووبارە هەوڵ بدەرەوە",
        note: "کاتێک ئینتەرنێت گەڕایەوە، پەڕەکە خۆی نوێ دەبێتەوە.",
        unreachable: "ناتوانرێت بگەیتە BookingBye",
        unreachableBody: "مۆبایلەکەت بە ئینتەرنێتەوە پەیوەستە، بەڵام BookingBye وەڵام ناداتەوە. دوای کەمێک دووبارە هەوڵ بدەرەوە."
      }
    };
    var copy = COPY[document.documentElement.lang] || COPY.en;
    document.querySelectorAll("[data-t]").forEach(function (el) {
      var text = copy[el.getAttribute("data-t")];
      if (text) el.textContent = text;
    });
    if (navigator.onLine) {
      document.querySelector('[data-t="title"]').textContent = copy.unreachable;
      document.querySelector('[data-t="body"]').textContent = copy.unreachableBody;
    }
    // Back online: load the page that failed.
    window.addEventListener("online", retry);
  })();
</script>
